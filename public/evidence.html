<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking record</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { background: #fff; }
    .doc { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 28px 0 8px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
    pre { white-space: pre-wrap; font: inherit; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
    .doc table.list { width: 100%; }
    .doc td, .doc th { overflow-wrap: anywhere; }
    /* Phones: the long tables become stacked rows, so the page never scrolls sideways. */
    @media (max-width: 640px) {
      .doc { padding: 20px 16px 48px; }
      .bar { flex-wrap: wrap; }
      #timeline tr, #convo tr, #payments tr, #changes tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--line, #e6e8ef); }
      #timeline td, #convo td, #payments td, #changes td, #changes th { display: block; white-space: normal !important; border: 0; padding: 2px 0; text-align: left; }
      #payments tr:first-child, #changes tr:first-child:has(th) { display: none; }
    }
    @media print { .noprint { display: none; } }
  </style>
</head>
<body>
  <div class="doc">
    <div class="noprint bar">
      <span class="small muted">Everything about this booking in one file: use it for disputes, chargebacks or your records.</span>
      <button class="btn secondary small" onclick="print()">Print or save as PDF</button>
    </div>
    <h1 id="title">Booking record</h1>
    <div class="muted" id="sub"></div>
    <h2>Terms the customer agreed to</h2><p id="terms"></p>
    <h2>Money</h2><table class="list" id="money"></table>
    <h2>Payments (with PayPal reference numbers)</h2><table class="list" id="payments"></table>
    <h2>Approved changes</h2><table class="list" id="changes"></table>
    <h2>History</h2><table class="list" id="timeline"></table>
    <h2>Full conversation</h2><table class="list" id="convo"></table>
  </div>
  <script type="module">
    import { api, money, $, escapeHtml } from '/js/common.js';
    const id = location.pathname.split('/').pop();
    const code = new URLSearchParams(location.search).get('code');
    let keys = [];
    try {
      keys = Object.values(JSON.parse(localStorage.getItem('fad-owner-keys') || '{}') || {}).filter(Boolean).slice(0, 10);
    } catch {}
    const e = await api(`/api/evidence/${encodeURIComponent(id)}${code ? `?code=${encodeURIComponent(code)}` : ''}`, { headers: keys.length ? { 'x-owner-key': keys.join(',') } : {} });
    const when = (iso) => new Date(iso).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
    $('#title').textContent = `${e.booking.customer} · ${e.booking.service}`;
    $('#sub').textContent = `${e.booking.appointment} · ${e.booking.status} · Booking ${e.booking.id}`;
    $('#terms').textContent = e.agreedTerms || 'Not recorded.';
    const t = e.totals;
    $('#money').innerHTML = `<tr><td>Total</td><td class="num">${money(t.total)}</td></tr><tr><td>Paid</td><td class="num">${money(t.paid)}</td></tr><tr><td>Tips</td><td class="num">${money(t.tips)}</td></tr><tr><td>Refunded${t.tipsRefunded ? ` (incl. ${money(t.tipsRefunded)} tip)` : ''}</td><td class="num">${money(t.refunded + (t.tipsRefunded || 0))}</td></tr><tr><td><strong>Still owed</strong></td><td class="num"><strong>${money(t.due)}</strong></td></tr>`;
    $('#payments').innerHTML = '<tr><th>When</th><th>What</th><th>Status</th><th>PayPal IDs</th><th class="num">Amount</th></tr>' + e.payments.map((p) => `<tr><td>${when(p.at)}</td><td>${escapeHtml(p.label)}</td><td>${escapeHtml(p.status)}${p.refund ? `<div class="small">refund ${money(p.refund.amount + (p.refund.tip || 0))}${p.refund.tip ? ` incl. ${money(p.refund.tip)} tip` : ''} (${escapeHtml(p.refund.refundId)})</div>` : ''}</td><td class="small">${escapeHtml(p.paypalOrderId || '')}<br>${escapeHtml(p.paypalCaptureId || '')}</td><td class="num">${money(p.amount)}${p.tip ? ` + ${money(p.tip)}` : ''}</td></tr>`).join('');
    $('#changes').innerHTML = e.changes.length ? '<tr><th>Change</th><th>Amount</th><th>Decision</th></tr>' + e.changes.map((c) => `<tr><td>${escapeHtml(c.description)}</td><td>${money(c.amount)}</td><td>${escapeHtml(c.status)}${c.decidedAt ? ` ${when(c.decidedAt)}` : ''}</td></tr>`).join('') : '<tr><td class="muted">None.</td></tr>';
    $('#timeline').innerHTML = e.timeline.map((x) => `<tr><td style="white-space:nowrap">${when(x.at)}</td><td>${escapeHtml(x.text)}</td></tr>`).join('');
    $('#convo').innerHTML = e.conversation.map((m) => `<tr><td style="white-space:nowrap">${when(m.at)}</td><td><strong>${escapeHtml(m.from)}</strong><br>${escapeHtml(m.text)}</td></tr>`).join('');
  </script>
</body>
</html>
